services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loja
      POSTGRES_PASSWORD: loja123
      POSTGRES_DB: loja_roupas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loja -d loja_roupas"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  pgdata:
